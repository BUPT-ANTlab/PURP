# Metro network training configuration.
build:
  pre_line: 4
  cost_per: [0.5, 0.3, 0.3]
  max_line: 3
  min_num: 10
  expand: false
gamma: 1.0
tau: 0.95
state_encoder_specs:
  state_encoder_hidden_size: [32, 16]
  gcn_node_dim: 32
  num_gcn_layers: 2
  num_edge_fc_layers: 2
  max_num_nodes: 2000
  max_num_edges: 3000
  num_attention_heads: 2
policy_specs:
  policy_road_head_hidden_size: [32, 1]
value_specs:
  value_head_hidden_size: [32, 32, 1]
lr: 0.0004
weightdecay: 0.0
eps: 0.00001
value_pred_coef: 0.5
entropy_coef: 0.01
clip_epsilon: 0.2
max_num_iterations: 100
steps_per_iteration: 4096
num_optim_epoch: 3
mini_batch_size: 32
eval_interval: 5
eval_samples: 32
save_model_interval: 5
